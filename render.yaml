# Render Blueprint (free tier). Not deployed from this repository's build.
# desk and paypal-mock build from the repository root and need the platform's shared/ packages
# vendored as ./platform/shared (see desk/Dockerfile) before the Blueprint is applied.
services:
  - type: web
    name: parley-desk
    runtime: docker
    plan: free
    dockerfilePath: ./desk/Dockerfile
    dockerContext: .
    healthCheckPath: /api/cases
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: parley-db
          property: connectionString
      - key: DECIDE_URL
        fromService:
          type: web
          name: parley-decide
          envVarKey: RENDER_EXTERNAL_URL
      - key: PAYPAL_ENV
        value: mock
      - key: PAYPAL_BASE_URL
        fromService:
          type: web
          name: parley-paypal-mock
          envVarKey: RENDER_EXTERNAL_URL
      - key: PAYPAL_CLIENT_ID
        value: mock-client
      - key: PAYPAL_CLIENT_SECRET
        value: mock-secret
      - key: DEMO_RESET_ON_BOOT
        value: "1"
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_API_KEY
        sync: false

  # a web service on the free plan: Render's private services need a paid plan
  - type: web
    name: parley-decide
    runtime: docker
    plan: free
    dockerfilePath: ./decide/Dockerfile
    dockerContext: ./decide

  - type: web
    name: parley-paypal-mock
    runtime: docker
    plan: free
    dockerfilePath: ./mock/Dockerfile
    dockerContext: .

databases:
  - name: parley-db
    plan: free
    databaseName: parley
