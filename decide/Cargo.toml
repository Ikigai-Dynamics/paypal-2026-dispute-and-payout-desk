[package]
name = "decide"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[[bin]]
name = "decide"
path = "src/main.rs"

[dependencies]
axum = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "signal"] }
